    <section class="home-box">
        <h2>Contact Us!</h2>

        <div class="home-box-row">
            <div class="home-box-div">
                <form action="https://wp.zybooks.com/form-viewer.php" method="POST" target="_blank">

                    <p>
                    <label for="first">First Name:</label>
                    <input type="text" name="first" id="first">
                    </p>
                    
                    <p>
                    <label for="last">Last Name:</label>
                    <input type="text" name="last" id="last">
                    </p>

                    <p>
                    <label for="phone">Phone Number:</label>
                    <input type="tel" name="phone" id="phone">
                    </p>

                    <p>
                    <label for="email">Email Address:</label>
                    <input type="email" name="email" id="email">
                    </p>

                    <p>
                        <label for="pet-name">Pet Name:</label>
                        <input type="text" name="pet-name" id="pet-name">
                    </p>

                    <p>
                        <label for="pet-type">Pet Type:</label>
                        <input type="text" name="pet-type" id="pet-type">
                    </p>

                    <p>
                        <label for="pet-age">Pet Age:</label>
                        <input type="text" name="pet-age" id="pet-age">
                    </p>

                    <p>
                    <label for="message">Additional Information::</label>
                    <textarea name="message" id="message" rows="10" cols="50">Enter your message here.</textarea>
                    </p>

                    <input type="submit" value="Submit"></input>
                    
                </form>
            </div>
        </div>


    </section>
